# Docs-side adjustments to api-reference/openapi.json, applied by Mintlify at build time (OpenAPI Overlay 1.1).
# Keep fixes that belong to the docs, not the API, here, so a regenerated spec from the backend can replace
# openapi.json without losing them. Mintlify auto-discovers this file through `extends`.
overlay: 1.1.0
info:
  title: Ringg AI docs adjustments
  version: 1.0.0
extends: ../openapi.json
actions:
  - target: $.info
    update:
      description: "The Ringg AI REST API. Base URL https://prod-api.ringg.ai/ca/api/v0; send your workspace API key in the X-API-KEY header from server-side code only. Requests and responses are JSON."
      contact:
        name: Ringg AI support
        email: admin@ringg.ai
        url: https://docs.ringg.ai
